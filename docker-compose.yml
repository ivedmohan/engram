services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: engram-falkordb
    ports:
      - "6379:6379" # Redis/Cypher protocol
      - "3000:3000" # FalkorDB Browser UI
    environment:
      - FALKORDB_ARGS=--appendonly yes --appendfsync everysec
    volumes:
      - falkordb_data:/data
    restart: unless-stopped

volumes:
  falkordb_data:
